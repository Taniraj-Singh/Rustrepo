# Fuzzing crate for Cairn, driven by `cargo fuzz` (libFuzzer).
#
# This is a separate, non-published crate with its own workspace so it does not
# perturb the main crate's dependency graph. Build the targets with:
#
#     cargo +nightly fuzz build
#     cargo +nightly fuzz run compression_fuzzer
#
# Each target asserts the crate's core safety property: no input, however
# malformed, makes a decoder panic, read out of bounds, or allocate without
# bound. Targets are named `<component>_fuzzer` so they are discovered by
# ClusterFuzzLite / OSS-Fuzz tooling.

[package]
name = "cairn-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cairn]
path = ".."

# Keep this crate out of the parent's build graph.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "compression_fuzzer"
path = "fuzz_targets/compression_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_fuzzer"
path = "fuzz_targets/block_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_fuzzer"
path = "fuzz_targets/wal_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "table_footer_fuzzer"
path = "fuzz_targets/table_footer_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_edit_fuzzer"
path = "fuzz_targets/version_edit_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write_batch_fuzzer"
path = "fuzz_targets/write_batch_fuzzer.rs"
test = false
doc = false
bench = false
